apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-main
spec:
  description: "Main PostgreSQL cluster for Zamorak"
  instances: 1

  managed:
    roles:
      - name: vaultwarden
        ensure: present
        login: true
        passwordSecret:
          name: vaultwarden-db-secret

      - name: n8n
        ensure: present
        login: true
        passwordSecret:
          name: n8n-db-secret

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "512MB"
      effective_cache_size: "2GB"
      maintenance_work_mem: "128MB"
      checkpoint_completion_target: "0.9"
      wal_compression: "on"
      log_min_duration_statement: "1000"

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

  monitoring:
    enablePodMonitor: false

  storage:
    size: 10Gi
    storageClass: local-path
