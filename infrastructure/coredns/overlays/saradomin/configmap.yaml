apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-saradomin
data:
  Corefile: |
    saradomin:53 {
        errors
        log

        template IN A {
          match ^(.+)\.saradomin\.$
          answer "{{ .Name }} 60 IN A 100.106.58.87"
          fallthrough
        }

        template IN A {
          match ^saradomin\.$
          answer "{{ .Name }} 60 IN A 100.106.58.87"
          fallthrough
        }

        cache 30
    }

    .:53 {
        errors
        log
        forward . 1.1.1.1 8.8.8.8
        cache 30
    }
