apiVersion: v1
kind: Service
metadata:
  name: coredns-saradomin
  labels:
    app.kubernetes.io/name: coredns-saradomin
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: coredns-saradomin
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
