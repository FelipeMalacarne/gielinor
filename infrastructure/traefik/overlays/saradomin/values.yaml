apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    global:
      checkNewVersion: false
      sendAnonymousUsage: false

    deployment:
      replicas: 1

    ingressClass:
      enabled: true
      isDefaultClass: true
      name: traefik

    providers:
      kubernetesCRD:
        enabled: true
        allowCrossNamespace: false
      kubernetesIngress:
        enabled: true
        publishedService:
          enabled: false

    logs:
      general:
        level: INFO
      access:
        enabled: true

    additionalArguments:
      - "--api.dashboard=true"
      - "--ping=true"

    ports:
      web:
        port: 80
        exposedPort: 80
        expose:
          default: true

      websecure:
        port: 443
        exposedPort: 443
        expose:
          default: true

    service:
      enabled: true
      single: true
      type: LoadBalancer
      annotations:
        tailscale.com/hostname: traefik
      spec:
        loadBalancerClass: tailscale

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
