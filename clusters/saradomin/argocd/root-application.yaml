apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: saradomin-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/FelipeMalacarne/gielinor.git
    targetRevision: main
    path: clusters/saradomin
    plugin:
      name: kustomize-ksops
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # O operador do Tailscale troca o externalName da saída para o postgres do zamorak
  # (apps/mesa/zamorak-postgres.yaml) pelo Service do proxy dele; o Argo não desfaz.
  ignoreDifferences:
    - group: ""
      kind: Service
      namespace: databases
      name: zamorak-postgres
      jsonPointers:
        - /spec/externalName
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - PruneLast=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
