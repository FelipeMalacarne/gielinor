apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespaces.yaml
  - infrastructure/traefik
  - infrastructure/cert-manager
  - infrastructure/intel-gpu
  - infrastructure/observability
  - infrastructure/adguard-home-dashboard
  - infrastructure/whoami
  - infrastructure/tailscale
  - infrastructure/cloudflared
  - infrastructure/argocd
  - infrastructure/cnpg
  - apps/postgres
  # - apps/openclaw
  - apps/media
  - apps/aerofoil
  - apps/filebrowser
  # - apps/docling
  # Passos de ativação no README do lastro (túnel no Terraform e o OIDC no secrets.yaml).
  - apps/lastro
  # Provedor OIDC em auth.ftm.dev.br; o que fazer depois do primeiro deploy: apps/zitadel/README.md.
  - apps/zitadel
  # Console SQL dos bancos do saradomin e do zamorak, só pela LAN e pelo tailnet: apps/mesa/README.md.
  - apps/mesa

labels:
  - pairs:
      gielinor.felipe/cluster: saradomin
      gielinor.felipe/site: home
