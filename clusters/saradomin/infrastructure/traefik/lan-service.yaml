apiVersion: v1
kind: Service
metadata:
  name: traefik-lan
  namespace: networking
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: traefik-networking
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: traefik-networking
  ports:
    - name: web
      port: 80
      targetPort: web
      protocol: TCP
    - name: websecure
      port: 443
      targetPort: websecure
      protocol: TCP
