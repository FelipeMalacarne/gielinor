apiVersion: v1
kind: ConfigMap
metadata:
  name: kubernetes-logs-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  kubernetes-logs.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "datasource": { "type": "loki", "uid": "${datasource}" },
          "gridPos": { "h": 7, "w": 24, "x": 0, "y": 0 },
          "id": 1,
          "options": {
            "deduplication": ["none"],
            "enableLogDetails": true,
            "prettifyLogMessage": false,
            "showCommonLabels": false,
            "showLabels": true,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLines": true
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "${datasource}" },
              "expr": "{cluster=~\"$cluster\", namespace=~\"$namespace\", pod=~\"$pod\", container=~\"$container\"}",
              "refId": "A"
            }
          ],
          "title": "Kubernetes Logs",
          "type": "logs"
        },
        {
          "datasource": { "type": "loki", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 10 },
                  { "color": "red", "value": 100 }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 5, "w": 8, "x": 0, "y": 7 },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "${datasource}" },
              "expr": "sum(count_over_time({cluster=~\"$cluster\", namespace=~\"$namespace\", pod=~\"$pod\", container=~\"$container\"} |~ \"(?i)error|fatal|panic\" [$__interval]))",
              "refId": "A"
            }
          ],
          "title": "Errors in the Selected Range",
          "type": "stat"
        },
        {
          "datasource": { "type": "loki", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "logs / interval",
                "axisPlacement": "auto",
                "drawStyle": "line",
                "fillOpacity": 15,
                "gradientMode": "none",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "none" },
                "thresholdsStyle": { "mode": "off" }
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 16, "x": 8, "y": 7 },
          "id": 3,
          "options": {
            "legend": {
              "calcs": ["mean", "max", "lastNotNull"],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": { "mode": "multi", "sort": "none" }
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "${datasource}" },
              "expr": "sum(count_over_time({cluster=~\"$cluster\", namespace=~\"$namespace\", pod=~\"$pod\", container=~\"$container\"} [$__interval]))",
              "legendFormat": "all logs",
              "refId": "A"
            },
            {
              "datasource": { "type": "loki", "uid": "${datasource}" },
              "expr": "sum(count_over_time({cluster=~\"$cluster\", namespace=~\"$namespace\", pod=~\"$pod\", container=~\"$container\"} |~ \"(?i)error|fatal|panic\" [$__interval]))",
              "legendFormat": "errors",
              "refId": "B"
            }
          ],
          "title": "Log Volume",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["logs", "loki", "kubernetes"],
      "templating": {
        "list": [
          {
            "current": { "text": "Loki", "value": "loki" },
            "hide": 0,
            "name": "datasource",
            "options": [],
            "query": "loki",
            "refresh": 1,
            "type": "datasource"
          },
          {
            "current": { "text": "saradomin", "value": "saradomin" },
            "datasource": { "type": "loki", "uid": "${datasource}" },
            "definition": "label_values(cluster)",
            "includeAll": false,
            "multi": false,
            "name": "cluster",
            "options": [],
            "query": "label_values(cluster)",
            "refresh": 1,
            "type": "query"
          },
          {
            "current": { "text": "All", "value": ["$__all"] },
            "allValue": ".*",
            "datasource": { "type": "loki", "uid": "${datasource}" },
            "definition": "label_values(namespace)",
            "includeAll": true,
            "multi": true,
            "name": "namespace",
            "options": [],
            "query": "label_values(namespace)",
            "refresh": 2,
            "type": "query"
          },
          {
            "current": { "text": "All", "value": ["$__all"] },
            "allValue": ".*",
            "datasource": { "type": "loki", "uid": "${datasource}" },
            "definition": "label_values(pod, namespace=~\"$namespace\")",
            "includeAll": true,
            "multi": true,
            "name": "pod",
            "options": [],
            "query": "label_values(pod, namespace=~\"$namespace\")",
            "refresh": 2,
            "type": "query"
          },
          {
            "current": { "text": "All", "value": ["$__all"] },
            "allValue": ".*",
            "datasource": { "type": "loki", "uid": "${datasource}" },
            "definition": "label_values(container, namespace=~\"$namespace\", pod=~\"$pod\")",
            "includeAll": true,
            "multi": true,
            "name": "container",
            "options": [],
            "query": "label_values(container, namespace=~\"$namespace\", pod=~\"$pod\")",
            "refresh": 2,
            "type": "query"
          }
        ]
      },
      "time": { "from": "now-6h", "to": "now" },
      "timezone": "browser",
      "title": "Kubernetes Logs",
      "uid": "kubernetes-logs",
      "version": 1
    }
