apiVersion: v1
kind: ConfigMap
metadata:
  name: infra-health-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  infra-health.json: |
    {
      "uid": "gielinor-infra-health",
      "title": "Gielinor — Saúde da Infra",
      "description": "Hosts, Kubernetes, Traefik e logs de erro do saradomin e do zamorak.",
      "tags": [
        "kubernetes",
        "multicluster",
        "infra"
      ],
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "refresh": "1m",
      "graphTooltip": 1,
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "timezone": "browser",
      "templating": {
        "list": [
          {
            "name": "cluster",
            "label": "Cluster",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(node_uname_info, cluster)",
              "refId": "cluster"
            },
            "definition": "label_values(node_uname_info, cluster)",
            "refresh": 1,
            "current": {
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "options": [],
            "sort": 1
          }
        ]
      },
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "links": [],
      "panels": [
        {
          "type": "row",
          "id": 1,
          "title": "Resumo",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "type": "stat",
          "id": 2,
          "title": "CPU",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 3,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "1 - avg by (cluster) (rate(node_cpu_seconds_total{cluster=~\"$cluster\", mode=\"idle\"}[5m]))",
              "legendFormat": "{{cluster}}",
              "range": false,
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null,
                    "color": "green"
                  },
                  {
                    "value": 0.75,
                    "color": "orange"
                  },
                  {
                    "value": 0.9,
                    "color": "red"
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "justifyMode": "auto",
            "orientation": "auto",
            "showPercentChange": false,
            "wideLayout": true
          }
        },
        {
