apiVersion: v1
kind: ConfigMap
metadata:
  name: mapa-service-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  mapa-service.json: |
    {
      "uid": "mapa-service",
      "title": "Mapa — Serviço",
      "description": "Tráfego, erros, latência por rota, logs e recursos do mapa-api e do mapa-worker.",
      "tags": [
        "mapa",
        "service"
      ],
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "refresh": "1m",
      "graphTooltip": 1,
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "timezone": "browser",
      "templating": {
        "list": []
      },
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          },
          {
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "enable": true,
            "iconColor": "rgba(255, 152, 48, 1)",
            "name": "Deploys",
            "expr": "changes(kube_deployment_status_observed_generation{cluster=\"zamorak\", namespace=\"mapa\"}[2m]) > 0",
            "step": "60s",
            "titleFormat": "Deploy {{deployment}}",
            "tagKeys": "deployment",
            "textFormat": "",
            "useValueForTime": false
          }
        ]
      },
      "links": [],
      "panels": [
        {
          "type": "row",
          "id": 1,
          "title": "Visão geral (período selecionado)",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "type": "stat",
          "id": 2,
          "title": "Requests",
          "description": "Total de requests que passaram pelo Traefik no período.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "sum(increase(traefik_service_requests_total{service=\"mapa-mapa-api-80@kubernetes\"}[$__range]))",
              "legendFormat": "__auto",
              "range": false,
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null,
                    "color": "green"
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "justifyMode": "auto",
            "orientation": "auto",
            "showPercentChange": false,
            "wideLayout": true
          }
        },
        {
          "type": "stat",
          "id": 3,
          "title": "Req/s agora",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 4,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "sum(rate(traefik_service_requests_total{service=\"mapa-mapa-api-80@kubernetes\"}[5m]))",
              "legendFormat": "__auto",
              "range": false,
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null,
                    "color": "green"
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "justifyMode": "auto",
            "orientation": "auto",
            "showPercentChange": false,
            "wideLayout": true
          }
        },
        {
          "type": "stat",
          "id": 4,
          "title": "Erros 5xx",
          "description": "5xx vistos pelo Traefik. Clientes que desconectam viram 499 aqui, não 5xx.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "(sum(increase(traefik_service_requests_total{service=\"mapa-mapa-api-80@kubernetes\", code=~\"5..\"}[$__range])) or vector(0)) / sum(increase(traefik_service_requests_total{service=\"mapa-mapa-api-80@kubernetes\"}[$__range]))",
              "legendFormat": "__auto",
              "range": false,
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null,
                    "color": "green"
                  },
                  {
                    "value": 0.001,
                    "color": "orange"
                  },
                  {
                    "value": 0.01,
                    "color": "red"
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "decimals": 3
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "justifyMode": "auto",
            "orientation": "auto",
            "showPercentChange": false,
            "wideLayout": true
          }
        },
        {
          "type": "stat",
          "id": 5,
          "title": "Respondidos em < 100 ms",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "sum(increase(traefik_service_request_duration_seconds_bucket{service=\"mapa-mapa-api-80@kubernetes\", le=\"0.1\"}[$__range])) / sum(increase(traefik_service_request_duration_seconds_count{service=\"mapa-mapa-api-80@kubernetes\"}[$__range]))",
              "legendFormat": "__auto",
              "range": false,
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null,
                    "color": "red"
                  },
                  {
                    "value": 0.95,
                    "color": "orange"
                  },
                  {
                    "value": 0.99,
                    "color": "green"
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "justifyMode": "auto",
            "orientation": "auto",
            "showPercentChange": false,
            "wideLayout": true
          }
        },
        {
          "type": "stat",
          "id": 6,
          "title": "p95 da API",
          "description": "Calculado a partir do duration_ms nos logs da API (mais preciso que os buckets do Traefik).",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 16,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "refId": "A",
              "expr": "quantile_over_time(0.95, {service_name=\"mapa-api\"} |= \"http_request\" | json | event=\"http_request\" | unwrap duration_ms | __error__=\"\" [$__range]) by (service_name)",
              "legendFormat": "",
              "queryType": "instant"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null,
                    "color": "green"
                  },
                  {
                    "value": 200,
                    "color": "orange"
                  },
                  {
                    "value": 500,
                    "color": "red"
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "justifyMode": "auto",
            "orientation": "auto",
            "showPercentChange": false,
            "wideLayout": true
          }
        },
        {
          "type": "stat",
          "id": 7,
          "title": "Restarts",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 20,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "sum(increase(kube_pod_container_status_restarts_total{cluster=\"zamorak\", namespace=\"mapa\"}[$__range])) or vector(0)",
              "legendFormat": "__auto",
              "range": false,
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null,
                    "color": "green"
                  },
                  {
                    "value": 1,
                    "color": "red"
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "justifyMode": "auto",
            "orientation": "auto",
            "showPercentChange": false,
            "wideLayout": true
          }
        },
        {
          "type": "row",
          "id": 8,
          "title": "Tráfego, erros e latência (Traefik)",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "id": 9,
          "title": "Req/s por status",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 6,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "sum by (code) (rate(traefik_service_requests_total{service=\"mapa-mapa-api-80@kubernetes\"}[$__rate_interval]))",
              "legendFormat": "{{code}}",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false,
                "axisSoftMin": 0,
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                }
              },
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null,
                    "color": "green"
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "id": 10,
          "title": "Taxa de 4xx e 5xx",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 6,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "sum(rate(traefik_service_requests_total{service=\"mapa-mapa-api-80@kubernetes\", code=~\"5..\"}[$__rate_interval])) / sum(rate(traefik_service_requests_total{service=\"mapa-mapa-api-80@kubernetes\"}[$__rate_interval]))",
              "legendFormat": "5xx",
              "range": true,
              "instant": false
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "B",
              "expr": "sum(rate(traefik_service_requests_total{service=\"mapa-mapa-api-80@kubernetes\", code=~\"4..\", code!=\"499\"}[$__rate_interval])) / sum(rate(traefik_service_requests_total{service=\"mapa-mapa-api-80@kubernetes\"}[$__rate_interval]))",
              "legendFormat": "4xx",
              "range": true,
              "instant": false
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "C",
              "expr": "sum(rate(traefik_service_requests_total{service=\"mapa-mapa-api-80@kubernetes\", code=\"499\"}[$__rate_interval])) / sum(rate(traefik_service_requests_total{service=\"mapa-mapa-api-80@kubernetes\"}[$__rate_interval]))",
              "legendFormat": "499 (cliente desistiu)",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false,
                "axisSoftMin": 0,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              },
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null,
                    "color": "green"
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "id": 11,
          "title": "Distribuição de latência",
          "description": "Fração dos requests abaixo de cada limite. Os buckets do Traefik são 0,1 / 0,3 / 1,2 / 5 s.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 6,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "sum(rate(traefik_service_request_duration_seconds_bucket{service=\"mapa-mapa-api-80@kubernetes\", le=\"0.1\"}[$__rate_interval])) / sum(rate(traefik_service_request_duration_seconds_count{service=\"mapa-mapa-api-80@kubernetes\"}[$__rate_interval]))",
              "legendFormat": "< 100 ms",
              "range": true,
              "instant": false
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "B",
              "expr": "sum(rate(traefik_service_request_duration_seconds_bucket{service=\"mapa-mapa-api-80@kubernetes\", le=\"0.3\"}[$__rate_interval])) / sum(rate(traefik_service_request_duration_seconds_count{service=\"mapa-mapa-api-80@kubernetes\"}[$__rate_interval]))",
              "legendFormat": "< 300 ms",
              "range": true,
              "instant": false
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "C",
              "expr": "sum(rate(traefik_service_request_duration_seconds_bucket{service=\"mapa-mapa-api-80@kubernetes\", le=\"1.2\"}[$__rate_interval])) / sum(rate(traefik_service_request_duration_seconds_count{service=\"mapa-mapa-api-80@kubernetes\"}[$__rate_interval]))",
              "legendFormat": "< 1,2 s",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false,
                "axisSoftMin": 0,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              },
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null,
                    "color": "green"
                  }
                ]
              },
              "max": 1
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "row",
          "id": 12,
          "title": "Por rota (logs da API)",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 14,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "id": 13,
          "title": "Req/s por rota (top 8)",
          "description": "",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 0,
            "y": 15,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "refId": "A",
              "expr": "topk(8, sum by (route) (rate({service_name=\"mapa-api\"} |= \"http_request\" | json | event=\"http_request\" [$__auto])))",
              "legendFormat": "{{route}}",
              "queryType": "range"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false,
                "axisSoftMin": 0,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              },
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null,
                    "color": "green"
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "id": 14,
          "title": "p95 por rota (top 8 mais lentas)",
          "description": "",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 12,
            "y": 15,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "refId": "A",
              "expr": "topk(8, quantile_over_time(0.95, {service_name=\"mapa-api\"} |= \"http_request\" | json | event=\"http_request\" | unwrap duration_ms | __error__=\"\" [$__auto]) by (route))",
              "legendFormat": "{{route}}",
              "queryType": "range"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false,
                "axisSoftMin": 0,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              },
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null,
                    "color": "green"
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "bargauge",
          "id": 15,
          "title": "Volume por rota",
          "description": "",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 0,
            "y": 23,
            "w": 6,
            "h": 10
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "refId": "A",
              "expr": "topk(12, sum by (route) (count_over_time({service_name=\"mapa-api\"} |= \"http_request\" | json | event=\"http_request\" [$__range])))",
              "legendFormat": "{{route}}",
              "queryType": "instant"
            }
