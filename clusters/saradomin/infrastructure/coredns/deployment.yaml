apiVersion: apps/v1
kind: Deployment
metadata:
  name: coredns-saradomin
  labels:
    app.kubernetes.io/name: coredns-saradomin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: coredns-saradomin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coredns-saradomin
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      containers:
        - name: coredns
          image: coredns/coredns:1.12.4
          imagePullPolicy: IfNotPresent
          args:
            - -conf
            - /etc/coredns/Corefile
          ports:
            - name: dns-udp
              containerPort: 53
              hostPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              hostPort: 53
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/coredns
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_BIND_SERVICE
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532

      volumes:
        - name: config
          configMap:
            name: coredns-saradomin
