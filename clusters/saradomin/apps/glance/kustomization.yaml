apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Dashboard inicial do saradomin em glance.saradomin.ftm.dev.br. Sem secrets, então
# sem KSOPS: renderiza sem a chave age. Detalhes: README.md.
namespace: dashboard

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# Com o hash no nome, mudar o glance.yml troca o ConfigMap e reinicia o pod.
configMapGenerator:
  - name: glance-config
    files:
      - glance.yml
    options:
      labels:
        app.kubernetes.io/name: glance
        app.kubernetes.io/part-of: dashboard
