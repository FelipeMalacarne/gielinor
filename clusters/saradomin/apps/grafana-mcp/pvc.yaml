# /data do mcp-auth-proxy: o BoltDB com os clientes registrados e os tokens, e as chaves que
# assinam os tokens. Perder o volume só obriga a conectar de novo.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-mcp-data
  labels:
    app.kubernetes.io/name: grafana-mcp
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
