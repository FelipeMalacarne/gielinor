apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# O sandbox do n8n Assistant: o chart oficial n8n-sandbox-service, com o runner Docker-in-Docker
# num user namespace. Por que assim, e como conferir: README.md.
namespace: n8n-sandbox

resources:
  - ca.yaml
  - helmchart.yaml
  - networkpolicy.yaml

secretGenerator:
  - name: n8n-sandbox-values
    files:
      - values.yaml=values.yaml

generators:
  - ksops.yaml

generatorOptions:
  disableNameSuffixHash: true
