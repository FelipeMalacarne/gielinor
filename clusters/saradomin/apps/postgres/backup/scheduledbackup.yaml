apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-main-daily
spec:
  # Seis campos, com segundos, em UTC: 06:17 UTC são 03:17 em São Paulo.
  schedule: "0 17 6 * * *"
  backupOwnerReference: self
  cluster:
    name: postgres-main
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
