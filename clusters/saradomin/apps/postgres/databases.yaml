apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: postgres-main-lastro
spec:
  cluster:
    name: postgres-main

  # O lastro cria um schema por módulo nas próprias migrations; ser dono do banco basta.
  name: lastro
  owner: lastro

  databaseReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: postgres-main-zitadel
spec:
  cluster:
    name: postgres-main

  # O init job do Zitadel (fase zitadel) cria os schemas dele; ser dono do banco basta.
  name: zitadel
  owner: zitadel

  databaseReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: postgres-main-mesa
spec:
  cluster:
    name: postgres-main

  # Os dados do próprio Mesa (../mesa): conexões, auditoria, histórico. As migrations dele
  # criam as tabelas no schema public; ser dono do banco basta.
  name: mesa
  owner: mesa

  databaseReclaimPolicy: retain
