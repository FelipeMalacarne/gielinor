apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - cluster.yaml
  - databases.yaml

generators:
  - ksops.yaml

# databases para tudo que não diz outro namespace (namespace.yaml).
transformers:
  - namespace.yaml

components:
  # Backup no R2 (WAL contínuo e um backup base por dia): backup/README.md. Se o
  # arquivamento quebrar, o WAL que não sai acumula no disco; comentar desliga.
  - backup
  # Os bancos que o Mesa cria para os apps: o Database, o role e os Secrets de cada um,
  # escritos pelo próprio Mesa (../mesa/README.md).
  - mesa
