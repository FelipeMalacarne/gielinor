apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: databases

resources:
  - cluster.yaml
  - databases.yaml

generators:
  - ksops.yaml

# Backup no R2 (WAL contínuo e um backup base por dia): backup/README.md. Se o
# arquivamento quebrar, o WAL que não sai acumula no disco; comentar desliga.
components:
  - backup
