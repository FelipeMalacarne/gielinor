apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Zitadel, o provedor OIDC do cluster (ADR-0008 do lastro). O banco é o zitadel do
# postgres-main compartilhado (apps/postgres). Como ligar: README.md.
namespace: security

resources:
  - helmchart.yaml

secretGenerator:
  - name: zitadel-values
    files:
      - values.yaml=values.yaml

generators:
  - ksops.yaml

generatorOptions:
  disableNameSuffixHash: true
