apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Chronicle: o que é do cluster. Como o app roda (Deployment com as migrations no initContainer,
# Service, Ingress na tailnet) vive no repositório do planner (deploy/k8s), apontado pela
# Application abaixo e atualizado pelo CI dele a cada push na `main`.
# O banco é o `chronicle` do postgres-main compartilhado (apps/postgres), não um Postgres próprio.
# Sem `namespace:` aqui: cada recurso diz o seu (argocd ou chronicle).
resources:
  - application.yaml

generators:
  - ksops.yaml
