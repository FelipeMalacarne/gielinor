# As identidades do Chronicle no namespace (doc 11 do planner, seções 7 e 13.3).
# O Deployment do app (deploy/k8s do planner) usa `serviceAccountName: chronicle`: aplique este
# arquivo antes de o Argo sincronizar essa versão, ou o ReplicaSet não cria o pod.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chronicle
  namespace: chronicle
  labels:
    app.kubernetes.io/name: chronicle
    app.kubernetes.io/component: web
---
# Os pods worker (um por conta). Nenhuma permissão: o token montado é só o projetado, de audiência
# `chronicle`, que o servidor confere por TokenReview; o da API do Kubernetes não é montado.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chronicle-worker
  namespace: chronicle
  labels:
    app.kubernetes.io/name: chronicle
    app.kubernetes.io/component: worker
automountServiceAccountToken: false
