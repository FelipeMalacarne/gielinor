apiVersion: apps/v1
kind: Deployment
metadata:
  name: docling-serve
  namespace: ai
  labels:
    app.kubernetes.io/name: docling-serve
    app.kubernetes.io/part-of: concursos-pipeline
    app.kubernetes.io/component: document-conversion
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: docling-serve

  template:
    metadata:
      labels:
        app.kubernetes.io/name: docling-serve
        app.kubernetes.io/part-of: concursos-pipeline
        app.kubernetes.io/component: document-conversion

    spec:
      nodeSelector:
        kubernetes.io/arch: amd64

      containers:
        - name: docling-serve
          image: quay.io/docling-project/docling-serve:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 5001
              protocol: TCP

          env:
            - name: DOCLING_SERVE_ENABLE_UI
              value: "1"

            # - name: DOCLING_SERVE_ARTIFACTS_PATH
            #   value: /tmp/docling-artifacts

          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "3"
              memory: 6Gi

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 10Gi
