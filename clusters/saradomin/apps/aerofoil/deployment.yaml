apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aerofoil-config
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aerofoil-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aerofoil
  labels:
    app.kubernetes.io/name: aerofoil
    app.kubernetes.io/part-of: switch-library
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: aerofoil
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aerofoil
        app.kubernetes.io/part-of: switch-library
    spec:
      nodeSelector:
        kubernetes.io/hostname: saradomin
      initContainers:
        - name: init-switch-storage
          image: busybox:1.37
          command:
            - sh
            - -c
            - >-
              chown 1001:1001 /games /downloads /conversion-tmp
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 25m
              memory: 32Mi
          volumeMounts:
            - name: games
              mountPath: /games
            - name: downloads
              mountPath: /downloads
            - name: conversion-tmp
              mountPath: /conversion-tmp
      containers:
        - name: aerofoil
          image: luketanti/aerofoil:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "1001"
            - name: PGID
              value: "1001"
            - name: USER_ADMIN_NAME
              valueFrom:
                secretKeyRef:
                  name: aerofoil-secrets
                  key: USER_ADMIN_NAME
            - name: USER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aerofoil-secrets
                  key: USER_ADMIN_PASSWORD
            - name: AEROFOIL_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: aerofoil-secrets
                  key: AEROFOIL_SECRET_KEY
            - name: AEROFOIL_CONVERSION_STAGING_ENABLED
              value: "true"
            - name: AEROFOIL_CONVERSION_STAGING_DIR
              value: /app/conversion-tmp
            - name: TZ
              value: America/Sao_Paulo
          ports:
            - name: http
              containerPort: 8465
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: data
              mountPath: /app/data
            - name: games
              mountPath: /games
            - name: downloads
              mountPath: /downloads
            - name: conversion-tmp
              mountPath: /app/conversion-tmp
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: aerofoil-config
        - name: data
          persistentVolumeClaim:
            claimName: aerofoil-data
        - name: games
          hostPath:
            path: /data/switch/games
            type: DirectoryOrCreate
        - name: downloads
          hostPath:
            path: /data/switch/downloads
            type: DirectoryOrCreate
        - name: conversion-tmp
          hostPath:
            path: /data/switch/conversion-tmp
            type: DirectoryOrCreate
