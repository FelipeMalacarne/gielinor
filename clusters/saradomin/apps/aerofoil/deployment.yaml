apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aerofoil-config
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aerofoil-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aerofoil
  labels:
    app.kubernetes.io/name: aerofoil
    app.kubernetes.io/part-of: switch-library
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: aerofoil
  template:
    metadata:
      annotations:
        gielinor.ftm.dev.br/secret-revision: "2"
      labels:
        app.kubernetes.io/name: aerofoil
        app.kubernetes.io/part-of: switch-library
    spec:
      nodeSelector:
        kubernetes.io/hostname: saradomin
      initContainers:
        - name: init-switch-storage
          image: busybox:1.37
          command:
            - sh
            - -c
            - >-
              chown 1001:1001 /data/switch/games /data/downloads/complete /conversion-tmp
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 25m
              memory: 32Mi
          volumeMounts:
            - name: data-host
              mountPath: /data
            - name: conversion-tmp
              mountPath: /conversion-tmp
        - name: configure-prowlarr
          image: luketanti/aerofoil:sha-5235c59
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -c
            - |
              import os
              import tempfile

              import yaml

              path = "/app/config/settings.yaml"
              if os.path.exists(path):
                  with open(path, "r", encoding="utf-8") as settings_file:
                      settings = yaml.safe_load(settings_file) or {}
              else:
                  settings = {}

              downloads = settings.setdefault("downloads", {})
              prowlarr = downloads.setdefault("prowlarr", {})
              prowlarr["url"] = os.environ["PROWLARR_URL"]
              prowlarr["api_key"] = os.environ["PROWLARR_API_KEY"]

              descriptor, temporary_path = tempfile.mkstemp(
                  dir=os.path.dirname(path),
                  prefix=".settings-",
                  suffix=".yaml",
              )
              try:
                  with os.fdopen(descriptor, "w", encoding="utf-8") as settings_file:
                      yaml.safe_dump(settings, settings_file)
                  os.replace(temporary_path, path)
              finally:
                  if os.path.exists(temporary_path):
                      os.unlink(temporary_path)
          env:
            - name: PROWLARR_URL
              value: http://prowlarr:9696
            - name: PROWLARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: arr-api-keys
                  key: PROWLARR_API_KEY
          volumeMounts:
            - name: config
              mountPath: /app/config
      containers:
        - name: aerofoil
          image: luketanti/aerofoil:sha-5235c59
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "1001"
            - name: PGID
              value: "1001"
            - name: USER_ADMIN_NAME
              valueFrom:
                secretKeyRef:
                  name: aerofoil-secrets
                  key: USER_ADMIN_NAME
            - name: USER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aerofoil-secrets
                  key: USER_ADMIN_PASSWORD
            - name: AEROFOIL_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: aerofoil-secrets
                  key: AEROFOIL_SECRET_KEY
            - name: AEROFOIL_CONVERSION_STAGING_ENABLED
              value: "true"
            - name: AEROFOIL_CONVERSION_STAGING_DIR
              value: /app/conversion-tmp
            - name: TZ
              value: America/Sao_Paulo
          ports:
            - name: http
              containerPort: 8465
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: data
              mountPath: /app/data
            - name: data-host
              mountPath: /data
            - name: conversion-tmp
              mountPath: /app/conversion-tmp
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: aerofoil-config
        - name: data
          persistentVolumeClaim:
            claimName: aerofoil-data
        - name: data-host
          hostPath:
            path: /data
            type: Directory
        - name: conversion-tmp
          hostPath:
            path: /data/switch/conversion-tmp
            type: DirectoryOrCreate
