apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lastro
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # Repositório público: sem credencial. Kustomize puro, sem o plugin ksops: os segredos
    # do app são criados por este repositório (secrets.yaml ao lado).
    repoURL: https://github.com/FelipeMalacarne/lastro.git
    targetRevision: main
    path: deploy/k8s/overlays/saradomin
  destination:
    server: https://kubernetes.default.svc
    namespace: lastro
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - PruneLast=true
