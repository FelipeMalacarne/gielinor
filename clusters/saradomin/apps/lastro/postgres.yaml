# Postgres só do lastro. O CNPG existe só no zamorak; para um usuário, um StatefulSet simples
# basta. A senha está em secrets.yaml, em lastro-postgres e na LASTRO_DATABASE_URL.
# Ainda sem backup: ver o README.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: lastro
  labels:
    app.kubernetes.io/name: lastro-postgres
spec:
  selector:
    app.kubernetes.io/name: lastro-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: lastro
  labels:
    app.kubernetes.io/name: lastro-postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lastro-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lastro-postgres
    spec:
      securityContext:
        # UID e GID do usuário postgres na imagem alpine.
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_USER
              value: lastro
            - name: POSTGRES_DB
              value: lastro
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lastro-postgres
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "lastro", "-d", "lastro"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "lastro", "-d", "lastro"]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
