apiVersion: v1
kind: ConfigMap
metadata:
  name: recyclarr-config
data:
  settings.yml: |
    resource_providers:
      - name: local-sonarr-custom-formats
        type: custom-formats
        path: /config/custom-formats/sonarr
        service: sonarr
      - name: local-radarr-custom-formats
        type: custom-formats
        path: /config/custom-formats/radarr
        service: radarr
      - name: local-radarr-profiles
        type: trash-guides
        path: /config/local-guides
  recyclarr.yml: |
    sonarr:
      tv:
        base_url: http://sonarr:8989
        api_key: !env_var SONARR_API_KEY
        delete_old_custom_formats: true
        quality_definition:
          type: series
        quality_profiles:
          - trash_id: 72dae194fc92bf828f32cde7744e51a1
            name: WEB-1080p
            reset_unmatched_scores:
              enabled: true
          - trash_id: d1498e7d189fbe6c7110ceaabb7473e6
            name: WEB-2160p
            reset_unmatched_scores:
              enabled: true
        custom_formats:
          - trash_ids:
              - fm-language-not-original-or-portuguese
            assign_scores_to:
              - name: WEB-1080p
                score: -10000
              - name: WEB-2160p
                score: -10000
        custom_format_groups:
          add:
            - trash_id: d776a1ea912a117d66d83b880ff2055d
              assign_scores_to:
                - name: WEB-2160p

    radarr:
      movies:
        base_url: http://radarr:7878
        api_key: !env_var RADARR_API_KEY
        delete_old_custom_formats: true
        quality_definition:
          type: movie
        quality_profiles:
          - trash_id: fm-hd-bluray-web-any-language
            name: HD Bluray + WEB
            reset_unmatched_scores:
              enabled: true
          - trash_id: fm-uhd-bluray-web-any-language
            name: UHD Bluray + WEB
            reset_unmatched_scores:
              enabled: true
        custom_formats:
          - trash_ids:
              - fm-language-not-original-or-portuguese
            assign_scores_to:
              - name: HD Bluray + WEB
                score: -10000
              - name: UHD Bluray + WEB
                score: -10000
        custom_format_groups:
          add:
            - trash_id: 7fc2751eef7e6bdc70b74136e5e35c76
              assign_scores_to:
                - name: UHD Bluray + WEB
