  configure-defaults.py: |
    import json
    import os
    from pathlib import Path
    from urllib.request import Request, urlopen

    stock_profiles = {
        "Any",
        "SD",
        "HD-720p",
        "HD-1080p",
        "Ultra-HD",
        "HD - 720p/1080p",
    }
    services = (
        {
            "name": "sonarr",
            "base_url": "http://sonarr:8989/api/v3",
            "api_key": os.environ["SONARR_API_KEY"],
            "target": "WEB-1080p",
            "optional": "WEB-2160p",
            "resource": "series",
        },
        {
            "name": "radarr",
            "base_url": "http://radarr:7878/api/v3",
            "api_key": os.environ["RADARR_API_KEY"],
            "target": "HD Bluray + WEB",
            "optional": "UHD Bluray + WEB",
            "resource": "movie",
        },
    )

    def request_json(url, api_key, method="GET", payload=None):
        data = None if payload is None else json.dumps(payload).encode()
        request = Request(
            url,
            data=data,
            method=method,
            headers={"X-Api-Key": api_key, "Content-Type": "application/json"},
        )
        with urlopen(request, timeout=30) as response:
            return json.load(response)

    def configure_arr(service):
        profiles = request_json(f"{service['base_url']}/qualityprofile", service["api_key"])
        profile_by_name = {profile["name"]: profile["id"] for profile in profiles}
        profile_by_id = {profile["id"]: profile["name"] for profile in profiles}
        for required in (service["target"], service["optional"]):
            if required not in profile_by_name:
                raise RuntimeError(f"{service['name']} profile is missing: {required}")

        target_id = profile_by_name[service["target"]]
        migrated = 0
        items = request_json(f"{service['base_url']}/{service['resource']}", service["api_key"])
        for item in items:
            current_name = profile_by_id.get(item.get("qualityProfileId"))
            if current_name in stock_profiles and item.get("qualityProfileId") != target_id:
                item["qualityProfileId"] = target_id
                request_json(
                    f"{service['base_url']}/{service['resource']}/{item['id']}",
                    service["api_key"],
                    method="PUT",
                    payload=item,
                )
                migrated += 1
        print(f"{service['name']}: migrated {migrated} existing item(s) to {service['target']}")
        return target_id

    def configure_seerr(service, profile_id, seerr_api_key):
        endpoint = f"http://seerr:5055/api/v1/settings/{service['name']}"
        servers = request_json(endpoint, seerr_api_key)
        candidates = [server for server in servers if not server.get("is4k", False)]
        if not candidates:
            print(f"seerr: no non-4K {service['name']} server is configured; skipping default")
            return
        server = next(
            (candidate for candidate in candidates if service["name"] in candidate.get("hostname", "")),
            candidates[0],
        )
        server["activeProfileId"] = profile_id
        server["activeProfileName"] = service["target"]
        server["isDefault"] = True
        request_json(
            f"{endpoint}/{server['id']}",
            seerr_api_key,
            method="PUT",
            payload=server,
        )
        print(f"seerr: {service['name']} now defaults to {service['target']}")

    def main():
        profile_ids = {service["name"]: configure_arr(service) for service in services}
        seerr_settings_path = Path("/seerr/settings.json")
        if not seerr_settings_path.exists():
            print("seerr: settings.json is absent; skipping request defaults")
            return
        seerr_settings = json.loads(seerr_settings_path.read_text())
        seerr_api_key = seerr_settings.get("main", {}).get("apiKey")
        if not seerr_api_key:
            print("seerr: API key is absent; skipping request defaults")
            return
        for service in services:
            configure_seerr(service, profile_ids[service["name"]], seerr_api_key)

    if __name__ == "__main__":
        main()
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: recyclarr-config
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: recyclarr
  labels:
    app.kubernetes.io/name: recyclarr
    app.kubernetes.io/part-of: arr-stack
spec:
  schedule: "15 4 * * *"
  timeZone: America/Sao_Paulo
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: recyclarr
            app.kubernetes.io/part-of: arr-stack
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/hostname: saradomin
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          initContainers:
            - name: prepare-config
              image: busybox:1.37@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
              command:
                - sh
                - -c
                - >-
                  set -eu;
                  cp /seed/settings.yml /config/settings.yml;
                  cp /seed/recyclarr.yml /config/recyclarr.yml;
                  mkdir -p /config/custom-formats/sonarr /config/custom-formats/radarr /config/local-guides/quality-profiles;
                  cp /seed/sonarr-language-not-original-or-portuguese.json /config/custom-formats/sonarr/language-not-original-or-portuguese.json;
                  cp /seed/radarr-language-not-original-or-portuguese.json /config/custom-formats/radarr/language-not-original-or-portuguese.json;
                  cp /seed/local-guides-metadata.json /config/local-guides/metadata.json;
                  cp /seed/radarr-hd-profile.json /config/local-guides/quality-profiles/hd-bluray-web.json;
                  cp /seed/radarr-uhd-profile.json /config/local-guides/quality-profiles/uhd-bluray-web.json;
                  chmod 0644 /config/settings.yml /config/recyclarr.yml /config/custom-formats/sonarr/language-not-original-or-portuguese.json /config/custom-formats/radarr/language-not-original-or-portuguese.json /config/local-guides/metadata.json /config/local-guides/quality-profiles/hd-bluray-web.json /config/local-guides/quality-profiles/uhd-bluray-web.json
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 5m
                  memory: 8Mi
                limits:
                  cpu: 25m
                  memory: 32Mi
              volumeMounts:
                - name: config
                  mountPath: /config
                - name: seed
                  mountPath: /seed
                  readOnly: true
            - name: recyclarr-sync
              image: ghcr.io/recyclarr/recyclarr:8.7.2@sha256:6e69e009e1cd7493ff6093e8e187b5d3788c75b4a2c0c5127b6a1beda1c19728
              imagePullPolicy: IfNotPresent
              args:
                - sync
              env:
                - name: TZ
                  value: America/Sao_Paulo
                - name: SONARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: arr-api-keys
                      key: SONARR_API_KEY
                - name: RADARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: arr-api-keys
                      key: RADARR_API_KEY
              resources:
                requests:
                  cpu: 25m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: config
                  mountPath: /config
          containers:
            - name: configure-defaults
              image: python:3.13-alpine@sha256:79e7a9b9ff1cbceff819f856fb374477792a5967759d94df266de7b7b4120e6f
              imagePullPolicy: IfNotPresent
              command:
                - python
                - /scripts/configure-defaults.py
              env:
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: SONARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: arr-api-keys
                      key: SONARR_API_KEY
                - name: RADARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: arr-api-keys
                      key: RADARR_API_KEY
              securityContext:
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: seerr-config
                  mountPath: /seerr
                  readOnly: true
          volumes:
            - name: config
              persistentVolumeClaim:
                claimName: recyclarr-config
            - name: seed
              configMap:
                name: recyclarr-config
            - name: scripts
              configMap:
                name: recyclarr-config
            - name: seerr-config
              persistentVolumeClaim:
                claimName: seerr-config
