apiVersion: v1
kind: ConfigMap
metadata:
  name: qbittorrent-config
data:
  qBittorrent.conf: |
    [BitTorrent]
    Session\Port=52457
    Session\UseRandomPort=false

    [Preferences]
    WebUI\Address=*
    WebUI\Port=8080
    WebUI\AuthenticationEnabled=false
    Downloads\SavePath=/data/downloads/complete/
    Downloads\TempPath=/data/downloads/incomplete/
    Downloads\TempPathEnabled=true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-config
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  labels:
    app.kubernetes.io/name: qbittorrent
    app.kubernetes.io/part-of: arr-stack
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qbittorrent
        app.kubernetes.io/part-of: arr-stack
    spec:
      nodeSelector:
        kubernetes.io/hostname: saradomin
      initContainers:
        - name: seed-config
          image: busybox:1.37
          command:
            - sh
            - -c
            - >-
              mkdir -p /config/qBittorrent;
              if [ ! -f /config/qBittorrent/qBittorrent.conf ]; then
                cp /seed/qBittorrent.conf /config/qBittorrent/qBittorrent.conf;
              fi;
              config=/config/qBittorrent/qBittorrent.conf;
              temporary="${config}.tmp";
              bittorrent_found=false;
              : > "${temporary}";
              while IFS= read -r line || [ -n "${line}" ]; do
                case "${line}" in
                  '[BitTorrent]')
                    printf '%s\n' "${line}" >> "${temporary}";
                    printf '%s\n' 'Session\Port=52457' >> "${temporary}";
                    printf '%s\n' 'Session\UseRandomPort=false' >> "${temporary}";
                    bittorrent_found=true
                    ;;
                  'Session\Port='*|'Session\UseRandomPort='*|'WebUI\AuthSubnetWhitelist='*|'WebUI\AuthSubnetWhitelistEnabled='*) ;;
                  *)
                    printf '%s\n' "${line}" >> "${temporary}"
                    ;;
                esac;
              done < "${config}";
              if [ "${bittorrent_found}" != true ]; then
                printf '%s\n' '[BitTorrent]' >> "${temporary}";
                printf '%s\n' 'Session\Port=52457' >> "${temporary}";
                printf '%s\n' 'Session\UseRandomPort=false' >> "${temporary}";
              fi;
              mv "${temporary}" "${config}";
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 25m
              memory: 32Mi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: seed
              mountPath: /seed
      containers:
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "1001"
            - name: PGID
              value: "1001"
            - name: TZ
              value: America/Sao_Paulo
            - name: WEBUI_PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
            - name: peer-tcp
              containerPort: 52457
              hostPort: 52457
              protocol: TCP
            - name: peer-udp
              containerPort: 52457
              hostPort: 52457
              protocol: UDP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /
              port: http
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: http
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            timeoutSeconds: 5
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-config
        - name: seed
          configMap:
            name: qbittorrent-config
        - name: data
          hostPath:
            path: /data
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  labels:
    app.kubernetes.io/name: qbittorrent
    app.kubernetes.io/part-of: arr-stack
spec:
  selector:
    app.kubernetes.io/name: qbittorrent
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qbittorrent-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sonarr
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: radarr
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8080
          protocol: TCP
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 52457
          protocol: TCP
        - port: 52457
          protocol: UDP
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: qbittorrent-auth
spec:
  basicAuth:
    secret: qbittorrent-webui-auth
    removeHeader: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qbittorrent
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: media-qbittorrent-auth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: qbit.saradomin.ftm.dev.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qbittorrent
                port:
                  name: http
    - host: qbit.saradomin
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qbittorrent
                port:
                  name: http
