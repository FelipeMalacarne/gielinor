apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildarr
  labels:
    app.kubernetes.io/name: buildarr
    app.kubernetes.io/part-of: arr-stack
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: buildarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buildarr
        app.kubernetes.io/part-of: arr-stack
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-arr
          image: busybox:1.37
          command:
            - sh
            - -c
            - >-
              until wget -qO- http://sonarr:8989/ping >/dev/null 2>&1; do sleep 5; done;
              until wget -qO- http://radarr:7878/ping >/dev/null 2>&1; do sleep 5; done;
              until wget -qO- http://prowlarr:9696/ping >/dev/null 2>&1; do sleep 5; done;
              until wget -qO- http://qbittorrent:8080 >/dev/null 2>&1; do sleep 5; done
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 25m
              memory: 32Mi
      containers:
        - name: buildarr
          image: callum027/buildarr:latest
          args:
            - daemon
          env:
            - name: TZ
              value: America/Sao_Paulo
            - name: PUID
              value: "1001"
            - name: PGID
              value: "1001"
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          projected:
            defaultMode: 0444
            sources:
              - configMap:
                  name: buildarr-config
                  items:
                    - key: buildarr.yml
                      path: buildarr.yml
              - secret:
                  name: arr-api-keys
                  items:
                    - key: buildarr-secret.yml
                      path: buildarr-secret.yml
