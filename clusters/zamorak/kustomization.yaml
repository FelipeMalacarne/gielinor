apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - components/namespaces
  - infrastructure/argocd
  - infrastructure/rabbitmq-operators
  - infrastructure/cloudflared
  - infrastructure/whoami
  - infrastructure/cnpg
  - apps/postgres
  - apps/redis
  - apps/vaultwarden
  - apps/n8n
  - apps/rabbitmq

labels:
  - pairs:
      gielinor.felipe/cluster: zamorak
      gielinor.felipe/site: oracle
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
