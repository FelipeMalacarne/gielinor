# ServiceAccount padrão do namespace: os pods do mapa (api, worker, migrate) não declaram
# SA própria, então o imagePullSecret entra por aqui e o repositório do mapa não precisa
# saber como o cluster autentica no GHCR.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: mapa
imagePullSecrets:
  - name: ghcr-pull
