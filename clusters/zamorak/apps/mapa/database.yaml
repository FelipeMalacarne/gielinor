apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: postgres-main-mapa
  namespace: databases
spec:
  cluster:
    name: postgres-main

  name: mapa
  owner: mapa

  # pgvector para os embeddings do M3 (ADR-002 do mapa). O role `mapa` está em
  # apps/postgres/cluster.yaml; a senha em secrets.yaml deste diretório.
  extensions:
    - name: vector
      ensure: present
    # Consultas por tempo acumulado (pg_stat_statements); a biblioteca é carregada pelo
    # parâmetro em apps/postgres/cluster.yaml.
    - name: pg_stat_statements
      ensure: present

  databaseReclaimPolicy: retain
