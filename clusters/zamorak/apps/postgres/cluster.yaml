apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-main
spec:
  description: "Main PostgreSQL cluster for Zamorak"
  instances: 1

  managed:
    roles:
      - name: vaultwarden
        ensure: present
        login: true
        passwordSecret:
          name: vaultwarden-db-secret

      - name: n8n
        ensure: present
        login: true
        passwordSecret:
          name: n8n-db-secret

      # mapa-do-acerto (ADR-017 do mapa): senha em apps/mapa/secrets.yaml (namespace databases).
      - name: mapa
        ensure: present
        login: true
        passwordSecret:
          name: mapa-db-secret

      # Mesa, o console SQL que roda no saradomin (clusters/saradomin/apps/mesa). Chega aqui
      # pelo tailnet, pelo Service postgres-main-tailnet abaixo. Superusuário pelo mesmo motivo
      # de lá; senha em mesa-secrets.yaml (a mesma vai na MESA_ZAMORAK_PASSWORD do saradomin).
      - name: mesa
        ensure: present
        login: true
        superuser: true
        passwordSecret:
          name: mesa-db-secret

    # O primário publicado no tailnet como zamorak-postgres, para o Mesa do saradomin. Sem
    # Ingress nem túnel da Cloudflare: entre os clusters o tráfego vai cifrado pelo Tailscale,
    # e a ACL do tailnet decide quem chega (tag:k8s → tag:k8s na porta 5432). O CNPG põe a
    # porta 5432 e o seletor do primário; o operador do Tailscale sobe o proxy.
    services:
      additional:
        - selectorType: rw
          serviceTemplate:
            metadata:
              name: postgres-main-tailnet
              annotations:
                tailscale.com/hostname: zamorak-postgres
                tailscale.com/proxy-class: tailnet-service
            spec:
              type: LoadBalancer
              loadBalancerClass: tailscale

  postgresql:
    parameters:
      max_connections: "100"
      # Memória (2026-11-10): o banco do mapa tem ~10 GB e o cache hit estava em 92–93%
      # com 512 MB de shared_buffers e 4 GiB de limite, num nó de 12 GB com ~8 livres.
      # shared_buffers num quarto do limite; effective_cache_size com o resto do pod
      # (o cache de disco do kernel conta no limite do cgroup).
      shared_buffers: "1536MB"
      effective_cache_size: "5GB"
      maintenance_work_mem: "128MB"
      # Planejador (2026-11-10, adendo da ADR-028 do mapa): disco local SSD, então
      # leitura aleatória custa quase o mesmo que a sequencial; work_mem maior tira
      # ordenações e hashes do disco. Os dois recarregam sem restart.
      random_page_cost: "1.1"
      work_mem: "16MB"
      checkpoint_completion_target: "0.9"
      wal_compression: "on"
      log_min_duration_statement: "1000"
      # pg_stat_statements: tempo acumulado por query, para achar o que gasta a CPU do
      # nó (o postgres-main era ~0,8 de 2 vCPUs em 2026-11-10). Definir um parâmetro
      # dele faz o CNPG pôr a biblioteca em shared_preload_libraries (pede restart);
      # a extensão em si é criada pelo Database de cada app (apps/mapa/database.yaml).
      pg_stat_statements.max: "5000"
      pg_stat_statements.track: "top"

  resources:
    requests:
      cpu: 500m
      # O request cobre o shared_buffers, que é memória do pod desde que o Postgres sobe.
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 6Gi

  monitoring:
    enablePodMonitor: false

  storage:
    size: 10Gi
    storageClass: local-path
