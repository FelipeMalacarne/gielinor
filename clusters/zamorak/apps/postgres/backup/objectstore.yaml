apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: r2-backups
  annotations:
    # O CRD vem do plugin (HelmChart em infrastructure/cnpg), que o helm-controller do
    # K3s instala depois do primeiro sync.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  configuration:
    # Mesmo bucket e token do saradomin, numa pasta do zamorak: os dois clusters se chamam
    # postgres-main, então s3://gielinor-postgres-backups/postgres-main/ é do saradomin e
    # este fica em s3://gielinor-postgres-backups/zamorak/postgres-main/.
    destinationPath: s3://gielinor-postgres-backups/zamorak/
    endpointURL: https://0eba569b4bb5e3bb00cdeae6772f44d8.r2.cloudflarestorage.com
    s3Credentials:
      accessKeyId:
        name: r2-backup-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: r2-backup-credentials
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
      # Um processo só: o nó tem 2 vCPUs e o Postgres já usa perto de uma.
      jobs: 1

  # Janela de recuperação: qualquer ponto dos últimos 7 dias. O backup existe para desastre
  # (perder o nó ou o disco), não para voltar no tempo; com o base semanal, isso guarda uns
  # dois backups base e o WAL entre eles. Os mais velhos são apagados depois do seguinte.
  retentionPolicy: "7d"

  instanceSidecarConfiguration:
    # O boto3 recente calcula checksums que nem todo S3 compatível aceita; a documentação
    # do plugin recomenda isto quando aparece o erro de x-amz-content-sha256.
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
