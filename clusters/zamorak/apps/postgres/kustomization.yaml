apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - cluster.yaml
  - databases.yaml

generators:
  - ksops.yaml

# databases para tudo que não diz outro namespace (namespace.yaml).
transformers:
  - namespace.yaml

# Os bancos que o Mesa (no saradomin) cria para os apps daqui: o Database, o role e os
# Secrets de cada um, escritos pelo próprio Mesa (clusters/saradomin/apps/mesa/README.md).
components:
  # Backup no R2 (WAL contínuo e um backup base por semana): backup/README.md. Se o
  # arquivamento quebrar, o WAL que não sai acumula no disco; comentar desliga.
  - backup
  - mesa
