apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - cluster.yaml
  - databases.yaml

generators:
  - ksops.yaml

# databases para tudo que não diz outro namespace (namespace.yaml).
transformers:
  - namespace.yaml

# Os bancos que o Mesa (no saradomin) cria para os apps daqui: o Database, o role e os
# Secrets de cada um, escritos pelo próprio Mesa (clusters/saradomin/apps/mesa/README.md).
components:
  - mesa
