apiVersion: rabbitmq.com/v1beta1
kind: Vhost
metadata:
  name: events
spec:
  name: events
  rabbitmqClusterReference:
    name: rabbitmq
---
apiVersion: rabbitmq.com/v1beta1
kind: User
metadata:
  name: n8n
spec:
  rabbitmqClusterReference:
    name: rabbitmq
---
apiVersion: rabbitmq.com/v1beta1
kind: Permission
metadata:
  name: n8n-events
spec:
  userReference:
    name: n8n
  vhost: events
  permissions:
    configure: ".*"
    write: ".*"
    read: ".*"
  rabbitmqClusterReference:
    name: rabbitmq
