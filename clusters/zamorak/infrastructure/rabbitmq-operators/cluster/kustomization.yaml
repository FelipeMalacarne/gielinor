apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - cluster-operator-v2.22.1.yaml

patches:
  - target:
      version: v1
      kind: Namespace
      name: rabbitmq-system
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: rabbitmq-system
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: rabbitmq-cluster-operator
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-options
        value: Replace=true
