apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - messaging-topology-operator-v1.19.3.yaml

patches:
  - target:
      version: v1
      kind: Namespace
      name: rabbitmq-system
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: rabbitmq-system
  # 2 vCPU no nó: o operador fica ocioso quase sempre; reserva mínima, limite mantido.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: messaging-topology-operator
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 25m
  # Nó único e réplica única: o rolling update cria o pod novo antes de matar o antigo e
  # trava quando o nó está cheio (surge nunca cabe). Recreate derruba o antigo primeiro.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: messaging-topology-operator
    patch: |-
      - op: replace
        path: /spec/strategy
        value:
          type: Recreate
