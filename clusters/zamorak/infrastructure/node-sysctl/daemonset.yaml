# Limites de inotify do nó. O padrão (128 instâncias por usuário) não basta: quase
# todo contêiner roda como root e divide a mesma cota, que o kubelet (um vigia por log
# seguido) e os containerd-shim (2 a 3 por contêiner) já enchem. Esgotada, o kubelet
# escreve "failed to create fsnotify watcher: too many open files" no log de cada
# contêiner. A VM não está em código, então o valor vem daqui a cada reinício do nó.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-sysctl
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: node-sysctl
  template:
    metadata:
      labels:
        app: node-sysctl
    spec:
      initContainers:
        - name: inotify
          image: busybox:1.36.1
          securityContext:
            privileged: true
          command:
            - sh
            - -c
            - |
              # Só sobe: nunca baixa um valor que alguém já tenha aumentado no nó.
              [ "$(cat /proc/sys/fs/inotify/max_user_instances)" -lt 512 ] && sysctl -w fs.inotify.max_user_instances=512
              [ "$(cat /proc/sys/fs/inotify/max_user_watches)" -lt 524288 ] && sysctl -w fs.inotify.max_user_watches=524288
              echo "instances=$(cat /proc/sys/fs/inotify/max_user_instances) watches=$(cat /proc/sys/fs/inotify/max_user_watches)"
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              memory: 16Mi
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 1m
              memory: 4Mi
            limits:
              memory: 8Mi
