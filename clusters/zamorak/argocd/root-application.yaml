apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zamorak-root
  namespace: argocd
spec:
  project: zamorak
  source:
    repoURL: https://github.com/FelipeMalacarne/gielinor.git
    targetRevision: main
    path: clusters/zamorak/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - PruneLast=true
